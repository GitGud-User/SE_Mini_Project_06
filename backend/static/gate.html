<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPMS · Gate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header></header>
<main>
  <h1>Gate console</h1>
  <div class="row">
    <form class="card" id="entryForm">
      <h2>Vehicle entry</h2>
      <label for="lot">Lot</label><select id="lot"></select>
      <label for="plate">Number plate</label><input id="plate" placeholder="KA01AB1234" required>
      <label for="vtype">Vehicle type</label>
      <select id="vtype">
        <option value="FOUR_WHEELER">Car</option><option value="TWO_WHEELER">Two-wheeler</option>
        <option value="EV">EV</option><option value="ACCESSIBLE">Accessible</option>
      </select>
      <label for="qr">Reservation QR (optional)</label><input id="qr">
      <button type="submit">Log entry</button>
      <div class="msg" id="entryMsg"></div>
    </form>
    <form class="card" id="exitForm">
      <h2>Vehicle exit</h2>
      <label for="xplate">Number plate</label><input id="xplate" placeholder="KA01AB1234" required>
      <button type="submit">Log exit &amp; compute fee</button>
      <div class="msg" id="exitMsg"></div>
      <div id="payBox" style="display:none">
        <p id="dueText"></p>
        <div class="row">
          <button type="button" id="payCash">Cash received</button>
          <button type="button" id="payOnline" class="secondary">UPI / card</button>
        </div>
        <div id="waiveBox" style="display:none">
          <label for="waiveReason">Admin waiver reason</label><input id="waiveReason" maxlength="300">
          <button type="button" id="waive" class="secondary">Waive fee</button>
        </div>
      </div>
      <button type="button" id="receiptBtn" class="secondary" style="display:none">Download receipt (PDF)</button>
    </form>
  </div>
  <form class="card" id="moveForm">
    <h2>Move a vehicle to another slot</h2>
    <div class="row">
      <div><label for="mticket">Ticket</label><input id="mticket" placeholder="T-000001" required></div>
      <div><label for="mslot">New slot</label><input id="mslot" placeholder="A-5" required></div>
    </div>
    <label for="mreason">Reason (saved in the audit log)</label><input id="mreason" maxlength="300" required>
    <button type="submit" class="secondary">Move vehicle</button>
    <div class="msg" id="moveMsg"></div>
  </form>
  <div class="card">
    <h2>Vehicles inside</h2>
    <table><thead><tr><th>Ticket</th><th>Plate</th><th>Type</th><th>Slot</th><th>Entered (UTC)</th></tr></thead><tbody id="open"></tbody></table>
  </div>
</main>
<script src="app.js"></script>
<script>
if (SPMS.requireRole(["ATTENDANT", "ADMIN"])) {
  SPMS.header("gate.html");
  const lotSel = document.getElementById("lot");
  SPMS.fillLots(lotSel).then(refresh);

  async function refresh() {
    const rows = await SPMS.api(`/api/v1/gate/sessions?only_open=true`);
    document.getElementById("open").innerHTML = rows.map(s =>
      `<tr><td>${SPMS.esc(s.ticket)}</td><td>${SPMS.esc(s.plate)}</td><td>${SPMS.esc(s.vehicle_type)}</td><td>${SPMS.esc(s.slot_code)}</td><td>${SPMS.esc(s.entry_time.replace("T", " ").slice(0, 16))}</td></tr>`).join("")
      || `<tr><td colspan="5" class="muted">No vehicles inside.</td></tr>`;
  }

  document.getElementById("entryForm").onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById("entryMsg");
    const body = { lot_id: Number(lotSel.value), plate: document.getElementById("plate").value,
                   vehicle_type: document.getElementById("vtype").value };
    const qr = document.getElementById("qr").value.trim();
    if (qr) body.reservation_qr = qr;
    try {
      const s = await SPMS.api("/api/v1/gate/entry", { method: "POST", body: JSON.stringify(body) });
      SPMS.show(msg, `Ticket ${s.ticket}: park ${s.plate} in slot ${s.slot_code}`, true);
      e.target.reset(); refresh();
    } catch (err) { SPMS.show(msg, err.message, false); }
  };

  // ---- exit + payment (F-061/F-062/F-063) ----
  const exitMsg = document.getElementById("exitMsg"), payBox = document.getElementById("payBox");
  const receiptBtn = document.getElementById("receiptBtn");
  let due = null, lastReceipt = null;
  const plateInput = () => document.getElementById("xplate").value.trim();

  async function tryExit() {
    payBox.style.display = "none"; receiptBtn.style.display = "none";
    try {
      const s = await SPMS.api("/api/v1/gate/exit", { method: "POST", body: JSON.stringify({ plate: plateInput() }) });
      SPMS.show(exitMsg, `${s.plate}: ${s.minutes} min parked · Fee ₹${s.fee.toFixed(2)} · Receipt ${s.receipt_no}`, true);
      lastReceipt = s.receipt_no; receiptBtn.style.display = "inline-block";
      document.getElementById("xplate").value = ""; refresh();
    } catch (err) {
      if (err.status === 402) return showDue();
      SPMS.show(exitMsg, err.message, false);
    }
  }

  async function showDue() {
    due = await SPMS.api(`/api/v1/payments/due?plate=${encodeURIComponent(plateInput())}`);
    SPMS.show(exitMsg, `Payment required before exit: ₹${due.amount_due.toFixed(2)}`, false);
    document.getElementById("dueText").textContent =
      `Ticket ${due.ticket} · ${due.minutes} min · fee ₹${due.total_fee.toFixed(2)}` +
      (due.advance ? ` − advance ₹${due.advance.toFixed(2)}` : "") + (due.paid ? ` − paid ₹${due.paid.toFixed(2)}` : "");
    document.getElementById("waiveBox").style.display = (SPMS.user() || {}).role === "ADMIN" ? "block" : "none";
    payBox.style.display = "block";
  }

  document.getElementById("exitForm").onsubmit = (e) => { e.preventDefault(); tryExit(); };
  document.getElementById("payCash").onclick = async () => {
    try {
      await SPMS.api("/api/v1/payments/cash", { method: "POST", body: JSON.stringify({ ticket: due.ticket, amount: due.amount_due }) });
      await tryExit();
    } catch (err) { SPMS.show(exitMsg, err.message, false); }
  };
  document.getElementById("payOnline").onclick = async () => {
    try {
      const order = await SPMS.api("/api/v1/payments/online/checkout", { method: "POST", body: JSON.stringify({ ticket: due.ticket }) });
      window.open(order.checkout_url, "_blank");
      SPMS.show(exitMsg, `Online payment of ₹${order.amount.toFixed(2)} opened in a new tab. After paying, click "Log exit" again.`, true);
    } catch (err) { SPMS.show(exitMsg, err.message, false); }
  };
  document.getElementById("waive").onclick = async () => {
    try {
      await SPMS.api("/api/v1/payments/waive", { method: "POST",
        body: JSON.stringify({ ticket: due.ticket, reason: document.getElementById("waiveReason").value }) });
      await tryExit();
    } catch (err) { SPMS.show(exitMsg, err.message, false); }
  };
  // ---- attendant override (F-041) ----
  document.getElementById("moveForm").onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById("moveMsg");
    const ticket = document.getElementById("mticket").value.trim().toUpperCase();
    try {
      const s = await SPMS.api(`/api/v1/gate/sessions/${encodeURIComponent(ticket)}/reassign`, { method: "POST",
        body: JSON.stringify({ slot_code: document.getElementById("mslot").value.trim(),
                               reason: document.getElementById("mreason").value }) });
      SPMS.show(msg, `${s.plate} moved to slot ${s.slot_code}`, true);
      e.target.reset(); refresh();
    } catch (err) { SPMS.show(msg, err.message, false); }
  };
  receiptBtn.onclick = () => SPMS.download(`/api/v1/receipts/${lastReceipt}/pdf`, `${lastReceipt}.pdf`)
    .catch(err => SPMS.show(exitMsg, err.message, false));
}
</script>
</body>
</html>
