# Team 06 - Smart Parking Management System (SPMS)
# CI workflow: runs all automated tests (with a coverage check) on every pull request to main
# and every push to main.  Location must be: .github/workflows/ci.yml

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:                      # <- job name "test" is the status check required by the "Protect main" ruleset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage (NF-006 - must stay at or above 70%)
        run: pytest -v --cov=backend --cov-report=term-missing --cov-fail-under=70
